<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate Clerk</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="mast">
  <div id="brand">
    <p class="mark">Plate Clerk</p>
    <p id="meta" class="meta">GTA VI · PS5 · 55 trophies</p>
  </div>
  <div id="progress">
    <p id="earned-line">0 / 55 earned</p>
    <div id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="55" aria-valuenow="0" aria-label="Trophies earned"><span id="progress-fill"></span></div>
    <p id="grade-counts">P 0/1 · G 0/2 · S 0/6 · B 0/46</p>
  </div>
  <div id="actions">
    <button id="spoiler-shield" type="button" aria-pressed="true">Spoiler shield on</button>
    <button id="export-progress" type="button">Export</button>
    <button id="import-progress" type="button">Import</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <p id="saved-note">Saved in this browser</p>
  </div>
</header>
<section id="audit" aria-label="Guide audit"></section>
<nav id="tabs" role="tablist" aria-label="Sections">
  <button id="tab-tracker" type="button" role="tab" aria-selected="true" aria-controls="tracker">Tracker</button>
  <button id="tab-roadmap" type="button" role="tab" aria-selected="false" aria-controls="roadmap">Roadmap</button>
  <button id="tab-missables" type="button" role="tab" aria-selected="false" aria-controls="missables">Missables</button>
  <button id="tab-sources" type="button" role="tab" aria-selected="false" aria-controls="sources">Sources</button>
</nav>
<main id="panels">
  <section id="tracker">
    <div id="filters" role="toolbar" aria-label="Filters"></div>
    <div id="list-col">
      <input id="search" type="search" placeholder="Search trophies  (/)" aria-label="Search trophies" autocomplete="off">
      <p id="reading"></p>
      <div id="trophy-list"></div>
    </div>
    <article id="guide"></article>
    <aside id="side">
      <section id="next-up"></section>
      <section id="guide-sources"></section>
    </aside>
  </section>
  <section id="roadmap" hidden></section>
  <section id="missables" hidden></section>
  <section id="sources" hidden></section>
</main>
<p id="toast" role="status" hidden></p>
<script type="module" src="js/app.js"></script>
</body>
</html>
